<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Rookie's Run</title>
    <style>
      /* Must match capacitor.config.ts SplashScreen.backgroundColor and
         components/run/NativeSplash.tsx SPLASH_BG, or the offline state
         flashes a different colour than the launch screen it replaces. */
      :root { --bg: #eef6fc; --text: #2b3a46; --muted: #6b7c8a; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: var(--bg); color: var(--text);
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px; padding: 32px calc(24px + env(safe-area-inset-right)) 32px calc(24px + env(safe-area-inset-left));
        text-align: center;
      }
      .rook { display: grid; grid-template-columns: repeat(5, 22px); gap: 3px; }
      .rook i { width: 22px; height: 22px; border-radius: 3px; display: block; }
      h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); max-width: 20rem; }
    </style>
  </head>
  <body>
    <!-- The pixel rook, matching lib/daily-rook-blocks.ts. Inline so the
         offline state needs no network at all. -->
    <div class="rook" aria-hidden="true">
      <i></i><i style="background:#3c4a54"></i><i></i><i style="background:#3c4a54"></i><i></i>
      <i style="background:#3c4a54"></i><i style="background:#3c4a54"></i><i style="background:#3c4a54"></i><i style="background:#3c4a54"></i><i style="background:#3c4a54"></i>
      <i></i><i style="background:#4a5a66"></i><i style="background:#4a5a66"></i><i style="background:#4a5a66"></i><i></i>
      <i></i><i></i><i style="background:#4a5a66"></i><i></i><i></i>
      <i></i><i style="background:#4a5a66"></i><i style="background:#4a5a66"></i><i style="background:#4a5a66"></i><i></i>
      <i style="background:#3c4a54"></i><i style="background:#3c4a54"></i><i style="background:#3c4a54"></i><i style="background:#3c4a54"></i><i style="background:#3c4a54"></i>
    </div>
    <h1>Rookie is offline</h1>
    <p>No connection right now. Today's run is waiting — reopen the app once you're back online.</p>
  </body>
</html>
