<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chess Boxing</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1c1c1e;
      }
      .wrap { text-align: center; padding: 24px; }
      h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
      p { color: #6b7280; margin: 0; font-size: 15px; }
    </style>
  </head>
  <body>
    <!--
      Local fallback shown only when chesspath.app can't be reached (offline).
      The live app loads over the network via capacitor.config server.url.
    -->

      <h1>Chess Boxing</h1>
      <p>Reconnecting… check your connection.</p>
    </div>
  </body>
</html>
