  <!-- Queen Icon - 22 dots, centered horizontally -->
  <!-- Icon content: 5 cols × 6 rows, 14px squares, 4px gap = 86px wide × 104px tall -->
  <!-- Centered in 200px: (200-86)/2 = 57 -->

  <!-- Row 0: Crown points (y=8) -->
  <rect x="57" y="8" width="14" height="14" rx="2" fill="url(#g-1CB0F6)"/>
  <rect x="93" y="8" width="14" height="14" rx="2" fill="url(#g-2FCBEF)"/>
  <rect x="129" y="8" width="14" height="14" rx="2" fill="url(#g-A560E8)"/>

  <!-- Row 1: Crown rim (y=26) -->
  <rect x="57" y="26" width="14" height="14" rx="2" fill="url(#g-58CC02)"/>
  <rect x="75" y="26" width="14" height="14" rx="2" fill="url(#g-FFC800)"/>
  <rect x="93" y="26" width="14" height="14" rx="2" fill="url(#g-FF9600)"/>
  <rect x="111" y="26" width="14" height="14" rx="2" fill="url(#g-FF6B6B)"/>
  <rect x="129" y="26" width="14" height="14" rx="2" fill="url(#g-FF4B4B)"/>

  <!-- Row 2: Head (y=44) -->
  <rect x="75" y="44" width="14" height="14" rx="2" fill="url(#g-1CB0F6)"/>
  <rect x="93" y="44" width="14" height="14" rx="2" fill="url(#g-2FCBEF)"/>
  <rect x="111" y="44" width="14" height="14" rx="2" fill="url(#g-A560E8)"/>

  <!-- Row 3: Neck (y=62) -->
  <rect x="75" y="62" width="14" height="14" rx="2" fill="url(#g-58CC02)"/>
  <rect x="93" y="62" width="14" height="14" rx="2" fill="url(#g-FFC800)"/>
  <rect x="111" y="62" width="14" height="14" rx="2" fill="url(#g-FF9600)"/>

  <!-- Row 4: Body (y=80) -->
  <rect x="75" y="80" width="14" height="14" rx="2" fill="url(#g-FF6B6B)"/>
  <rect x="93" y="80" width="14" height="14" rx="2" fill="url(#g-FF4B4B)"/>
  <rect x="111" y="80" width="14" height="14" rx="2" fill="url(#g-1CB0F6)"/>

  <!-- Row 5: Base (y=98) -->
  <rect x="57" y="98" width="14" height="14" rx="2" fill="url(#g-2FCBEF)"/>
  <rect x="75" y="98" width="14" height="14" rx="2" fill="url(#g-A560E8)"/>
  <rect x="93" y="98" width="14" height="14" rx="2" fill="url(#g-58CC02)"/>
  <rect x="111" y="98" width="14" height="14" rx="2" fill="url(#g-FFC800)"/>
  <rect x="129" y="98" width="14" height="14" rx="2" fill="url(#g-FF9600)"/>

  <!-- Wordmark: "chesspath" on one line -->
  <text x="100" y="175" text-anchor="middle" font-family="DM Sans, Inter, system-ui, sans-serif" font-size="36" font-weight="700">
    <tspan fill="#FFFFFF">chess</tspan><tspan fill="url(#pathGradient)">path</tspan>
  </text>
